name: Swift (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift-macos:
    name: Swift (macOS)
    # Self-hosted runner (Claw): Codeberg provides no hosted Actions runners.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/$PR_NUMBER/merge"
          else
            git fetch --depth=1 origin "$GITHUB_SHA"
          fi
          git checkout --detach FETCH_HEAD
      - name: Format, lint, build, test
        env:
          MARKDOWNPDF_ARTIFACT_DIR: ${{ github.workspace }}/rendered-test-artifacts/macos
          # The runner is a long-lived Mac, so `brew install` only has to ensure
          # the tools are present. Without these, Homebrew auto-updates itself,
          # upgrades every outdated formula and dependent, and since Homebrew 7
          # asks "Do you want to proceed?" and waits on stdin, which stalls the
          # job until the runner's time limit kills it.
          HOMEBREW_NO_ASK: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          brew install mupdf poppler qpdf swiftformat swiftlint verapdf
          brew install --cask font-urw-base35
          brew install --cask font-liberation
          fc-cache -f "$HOME/Library/Fonts" || true
          export MARKDOWNPDF_OPEN_FONT_PATH="$HOME/Library/Fonts/LiberationSans-Regular.ttf"
          swiftformat . --config .swiftformat --lint
          swiftlint --config .swiftlint.yml --strict
          swift build && swift test
      - name: Upload PDF witness artifacts
        if: always()
        # v3: Codeberg's Forgejo serves the v3 artifact API; the v4 protocol fails.
        uses: actions/upload-artifact@v3.2.2-node20
        with:
          name: markdownpdf-witness-macos
          path: rendered-test-artifacts/macos
          if-no-files-found: error
