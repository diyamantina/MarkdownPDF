name: Swift (Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift-linux:
    name: Swift (Linux)
    runs-on: ubuntu-latest
    # Prebuilt CI image: swift 6.1 + node 22 + qpdf/poppler/mupdf/veraPDF +
    # DejaVu fonts, so no per-run tool install. Source: MarkdownPdfHQ ci-image.
    container: codeberg.org/markdownpdfhq/ci-swift:6.1
    steps:
      - name: Checkout repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/$PR_NUMBER/merge"
          else
            git fetch --depth=1 origin "$GITHUB_SHA"
          fi
          git checkout --detach FETCH_HEAD
      - name: Build and test
        env:
          MARKDOWNPDF_ARTIFACT_DIR: ${{ github.workspace }}/rendered-test-artifacts/linux
        run: |
          export MARKDOWNPDF_OPEN_FONT_PATH=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          swift build && swift test
      - name: Upload PDF witness artifacts
        if: always()
        # v3: Codeberg's Forgejo serves the v3 artifact API; the v4 protocol fails.
        uses: actions/upload-artifact@v3.2.2
        with:
          name: markdownpdf-witness-linux
          path: rendered-test-artifacts/linux
          if-no-files-found: error
