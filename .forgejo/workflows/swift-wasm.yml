name: Swift (WASM)

# Build the engine for WebAssembly (wasm32-unknown-wasip1) on every change so the
# badge reflects current WASI build health. This is a build check; running wasm
# tests needs a separate runtime and is out of scope for this gate.
#
# Uses the swift:6.3.2 container plus the official swift.org wasm SDK for the
# same version, so the host compiler and SDK match exactly and no toolchain
# bootstrap is needed. (The old swiftly route existed for a segfault in
# swift:6.3.0 with the swiftwasm bundle; the official SDK installs cleanly.)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Swift (WASM)
    # Self-hosted runner (Claw): Codeberg provides no hosted Actions runners.
    runs-on: ubuntu-latest
    container: swift:6.3.2
    steps:
      - name: Checkout
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/$PR_NUMBER/merge"
          else
            git fetch --depth=1 origin "$GITHUB_SHA"
          fi
          git checkout --detach FETCH_HEAD
      - name: Install the wasm SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.3.2-release/wasm-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz --checksum a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
      - name: Build for WebAssembly
        run: |
          swift build --swift-sdk swift-6.3.2-RELEASE_wasm
          swift build -c release --swift-sdk swift-6.3.2-RELEASE_wasm
